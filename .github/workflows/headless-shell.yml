name: Headless Shell

on:
  push:
  workflow_dispatch:
    inputs:
      mode:
        description: Build configuration
        type: choice
        options: [dev, release]
        default: dev
      runner:
        description: Existing Linux x64 runner label
        type: string
        default: ubuntu-22.04
      jobs:
        description: Parallel build jobs
        type: string
        default: '4'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            guance
            .github
          fetch-depth: 2
          persist-credentials: false
      - run: bash guance/validate.sh
      - name: Report standard runner resources
        run: |
          df -h
          free -h
          nproc

  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/build-dev-')
    needs: validate
    runs-on: ${{ inputs.runner || 'ubuntu-22.04' }}
    concurrency:
      group: headless-shell-build
      cancel-in-progress: false
    timeout-minutes: 360
    env:
      MODE: ${{ inputs.mode || 'dev' }}
      JOBS: ${{ inputs.jobs || '4' }}
      PERSISTENT_ROOT: ${{ vars.HEADLESS_BUILD_ROOT }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            guance
            .github
          fetch-depth: 2
          persist-credentials: false
      - name: Select build directory and check resources
        shell: bash
        run: |
          set -euo pipefail
          [[ "$JOBS" =~ ^[1-9][0-9]*$ ]] || { echo 'jobs must be a positive integer' >&2; exit 1; }
          if [[ '${{ runner.environment }}' == 'self-hosted' && -n "$PERSISTENT_ROOT" ]]; then
            [[ "$PERSISTENT_ROOT" == /* ]] || { echo 'HEADLESS_BUILD_ROOT must be absolute' >&2; exit 1; }
            build_root="$PERSISTENT_ROOT"
          else
            build_root="$RUNNER_TEMP/headless-shell"
          fi
          mkdir -p "$build_root"
          echo "BUILD_ROOT=$build_root" >> "$GITHUB_ENV"
          df -h "$build_root"
          free -h
          available_kb=$(df -Pk "$build_root" | awk 'NR == 2 {print $4}')
          if (( available_kb < 50 * 1024 * 1024 )); then
            echo "Available: ${available_kb} KiB; at least 50 GiB free is required before starting. This is not a peak-space guarantee." >&2
            exit 1
          fi
      - name: Prepare source
        run: bash guance/prepare.sh "$BUILD_ROOT"
      - name: Install hosted runner dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo python3 "$BUILD_ROOT/src/build/install-build-deps.py" --no-prompt --no-arm --no-android --no-chromeos-fonts --no-syms --no-nacl
          sudo apt-get install -y fonts-noto-cjk fonts-liberation
      - name: Build
        run: bash guance/build.sh "$BUILD_ROOT/src" "$MODE" "$JOBS"
      - name: Package and verify
        run: bash guance/package.sh "$BUILD_ROOT/src" "$MODE" "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: headless-shell-linux-x64-${{ inputs.mode || 'dev' }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
